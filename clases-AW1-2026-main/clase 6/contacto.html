    <main>
        <img src="./recursos/imagenes/petshop.jpg" alt="Imagen de contacto">
        <h1>Contacto</h1>
        <h2>Escribinos</h2>
        <!-- formulario web -->
        <!-- action es donde (lugar) y el metodo es el como -->
        <form action="/contacto.html" method="post">
            <!-- 
            nombre
            telefono
            mail
            direccion
            tamanio
            consulta
            -->
            <label for="id-nombre">Nombre:</label>
            <input type="text" name="nombre" id="id-nombre">
            <label for="id-telefono">Teléfono:</label>
            <input type="tel" name="telefono" id="id-telefono">
            <label for="id-email">Email:</label>
            <input type="email" name="email" id="id-email">
            <label for="id-tamanio">Tamaño:</label>
            <select name="tamanio" id="id-tamanio">
                <option value="Pequeño">Pequeño</option>
                <option value="Mediano">Mediano</option>
                <option value="Grande">Grande</option>
            </select>
            <label for="id-consulta">Consulta:</label>
            <textarea name="consulta" id="id-consulta"></textarea>

            <!-- ----------------- -->

            <!-- <input type="submit" value="Enviar"> -->
            <button type="submit">Enviar</button>
        </form >
