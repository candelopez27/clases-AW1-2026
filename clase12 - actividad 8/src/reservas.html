<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./recursos/css/index.css">
    <title>Retiro Sustentable - Reservas</title>
</head>
<body>
    <header>
        <!-- Enlace que envuelve al isologotipo para redirigir al inicio -->
        <a href="index.html">
            <img src="./recursos/imagenes/logo-rs.svg" alt="Retiro Sustentable - Volver a la página principal" width="150" height="100">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Reservas</h1>
        <h2>Contactanos</h2>
        <form action="./contacto.html" method="post">
        <label for="id-nombre">Nombre:</label>
        <input type="text" name="nombre" id="id-nombre">
        <label for="id-telefono">Teléfono:</label>
        <input type="tel" name="telefono" id="id-telefono">
        <label for="id-email">Email:</label>
        <input type="email" name="email" id="id-email">
        <label for="id-fecha-desde">Fecha desde:</label>
        <input type="date" name="fecha_desde" id="id-fecha-desde">
        <label for="id-fecha-hasta">Fecha hasta:</label>
        <input type="date" name="fecha_hasta" id="id-fecha-hasta">
        <label for="id-comentario">Comentario:</label>
        <textarea name="comentario" id="id-comentario"></textarea>
        <button type="submit">Enviar</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Retiro Sustentable. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
